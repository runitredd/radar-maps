:root{
  --bg:#151b20;
  --panel:rgba(14,19,23,.9);
  --edge:rgba(255,255,255,.10);
  --ink:#eef1f2;
  --muted:#98a3a9;
  --wp:#c04de0;
  --wpDeep:#7d2a96;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:'Pricedown','Arial Narrow',system-ui,sans-serif;font-size:20px;letter-spacing:.02em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

#map{position:fixed;inset:0}
.player img{display:block;width:32px;height:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.home-pin img{display:block;width:32px;height:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.wp{width:22px;height:22px;border-radius:50%;background:var(--wp);border:3px solid #fff;
  box-shadow:0 0 0 4px rgba(192,77,224,.35),0 2px 8px rgba(0,0,0,.6)}

#explore-ui,#drive-ui{position:fixed;inset:0;pointer-events:none}
#explore-ui>*,#drive-ui>*{pointer-events:auto}
body.drive #explore-ui{display:none}
body:not(.drive) #drive-ui{display:none}
body.drive .maplibregl-ctrl-attrib{display:none}

.glass{background:var(--panel);border:1px solid var(--edge);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.fab{border-radius:10px;min-width:52px;height:52px;padding:0 16px;font-weight:700;font-size:19px}
.fab.icon{font-size:24px;padding:0}

/* ---- explore ---- */
#search{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;border-radius:10px;overflow:hidden}
#q{flex:1;min-width:0;background:transparent;border:0;padding:12px 14px;font-family:'SignPainter',sans-serif;font-size:28px;outline:none}
#q::placeholder{color:var(--muted)}
#search button{background:transparent;padding:0 16px;font-weight:700;color:var(--wp)}
#results{position:absolute;top:calc(66px + env(safe-area-inset-top,0px));left:12px;right:12px;max-height:50vh;overflow:auto;border-radius:10px;z-index:6}
#results button{display:block;width:100%;text-align:left;background:transparent;padding:11px 14px;border-bottom:1px solid var(--edge);line-height:1.1;font-family:'SignPainter',sans-serif;font-size:26px}
#results button:last-child{border-bottom:0}
#results small{display:block;color:var(--muted);font-family:'Pricedown','Arial Narrow',sans-serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .dist{float:right;color:var(--ink);font-family:'Pricedown','Arial Narrow',sans-serif;font-size:16px;font-weight:700;margin-left:10px}
.fabs{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
body.has-route .fabs{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
#routeCard{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  border-left:4px solid var(--wp);border-radius:10px;padding:12px 14px}
#clearBtn{position:absolute;top:-16px;right:-6px;width:34px;height:34px;border-radius:50%;
  background:#c8323a;font-size:18px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.45)}
#destName{font-family:'SignPainter',sans-serif;font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
#routeMeta{color:var(--muted);margin-top:2px}
#routeCard .row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-width:0;height:46px;border-radius:8px;background:var(--wp);font-weight:700;font-size:18px}
.btn.ghost{background:rgba(255,255,255,.08)}
#preview{margin-top:10px;max-height:38vh;overflow:auto;border-top:1px solid var(--edge)}
#preview .step{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--edge)}
#preview .step:last-child{border-bottom:0}
#preview .arr{width:28px;text-align:center;font-weight:700;flex:none}
#preview .txt{flex:1;min-width:0}
#preview .miles{color:var(--muted);flex:none}

/* ---- drive (full-screen navigation) ---- */
#banner{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;border-radius:12px;overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.45)}
#banner .main{display:flex;align-items:center;gap:14px;background:var(--wp);padding:14px 16px}
#turnArrow{font-size:52px;line-height:1;width:54px;text-align:center;font-weight:700}
#turnDist{font-size:36px;font-weight:700;line-height:1}
#turnText{font-size:22px;line-height:1.15;margin-top:3px}
#thenRow{background:var(--wpDeep);padding:7px 16px;font-size:19px;font-weight:600}
#thenArrow{font-size:22px;margin-left:6px}
#speedBubble{position:absolute;left:12px;bottom:calc(108px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;
  background:#f4f6f7;color:#11161a;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px #11161a,0 4px 12px rgba(0,0,0,.5)}
#speed{font-size:28px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
#speedBubble small{font-size:13px;font-weight:600}
#recenterDrive{position:absolute;right:12px;bottom:calc(108px + env(safe-area-inset-bottom,0px))}
#sheet{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;border-bottom:0}
#exitBtn{width:52px;height:52px;border-radius:50%;background:#c8323a;font-size:22px;font-weight:700;flex:none}
#sheet .info{flex:1;min-width:0}
#etaMain{font-size:30px;font-weight:700;line-height:1}
#etaSub{color:var(--muted);font-size:19px;margin-top:2px}
.credit{font-size:11px;color:var(--muted);opacity:.7;text-align:right;align-self:flex-end}

#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 16px;max-width:88vw;text-align:center;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
body.drive #toast{top:calc(170px + env(safe-area-inset-top,0px))}
#toast.show{opacity:1}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;
  padding:32px 26px calc(40px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(21,27,32,.2) 0%,rgba(21,27,32,.85) 45%,#151b20 75%)}
#start h1{margin:0;font-size:64px;line-height:.9;font-weight:700;letter-spacing:-.01em}
#start p{margin:0;color:var(--muted);font-size:19px;max-width:30ch;line-height:1.3}
#startBtn{height:58px;border-radius:10px;background:var(--wp);font-size:23px;font-weight:700}
#startNote{font-size:16px!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--wp);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="map"></div>

<div id="explore-ui">
  <form id="search" class="glass" autocomplete="off">
    <input id="q" type="search" placeholder="Type a place or address" enterkeyhint="search" aria-label="Search" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div id="results" class="glass hidden"></div>
  <div class="fabs">
    <button id="homeBtn" class="fab glass">Home</button>
    <button id="setHomeBtn" class="fab glass">Set home</button>
    <button id="recenter" class="fab icon glass hidden" aria-label="Recenter on me">◎</button>
    <button id="toDrive" class="fab glass">Drive</button>
  </div>
  <div id="routeCard" class="glass hidden">
    <button id="clearBtn" aria-label="Clear trip">✕</button>
    <div id="destName"></div>
    <div id="routeMeta">Finding a route…</div>
    <div class="row">
      <button id="previewBtn" class="btn ghost">Trip preview</button>
      <button id="goBtn" class="btn">Start trip</button>
    </div>
    <div id="preview" class="hidden"></div>
  </div>
</div>

<div id="drive-ui">
  <div id="banner" class="hidden">
    <div class="main">
      <div id="turnArrow">↑</div>
      <div><div id="turnDist"></div><div id="turnText"></div></div>
    </div>
    <div id="thenRow" class="hidden">Then<span id="thenArrow"></span></div>
  </div>
  <div id="speedBubble"><div id="speed">0</div><small>mph</small></div>
  <button id="recenterDrive" class="fab glass hidden">Re-center</button>
  <div id="sheet" class="glass">
    <button id="exitBtn" aria-label="End trip">✕</button>
    <div class="info"><div id="etaMain">Free drive</div><div id="etaSub">Search or tap the map to set a waypoint</div></div>
    <div class="credit">© OpenStreetMap<br>OpenFreeMap</div>
  </div>
</div>

<div id="toast"></div>

<div id="start">
  <h1>Radar<br>Maps</h1>
  <p>Allow location and motion access when asked. Motion lets the map turn with you.</p>
  <button id="startBtn">Start</button>
  <p id="startNote" class="hidden"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ---------- free services, no keys ----------
const TILES  = 'https://tiles.openfreemap.org/planet';
const GLYPHS = 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';
const ROUTER = 'https://router.project-osrm.org/route/v1/driving/';
const SEARCH = 'https://photon.komoot.io/api/';

// ---------- map colors (edit these to restyle) ----------
const C = {
  ground:'#5c5c5e',   // open ground
  road:'#b7b9b8',     // roads
  block:'#2a2a2a',    // city blocks
  water:'#3a3a3a',    // water
  green:'#6e6e6e',    // parks and grass
  blockEdge:'#333333', rail:'#474747',
  label:'#ededed', halo:'#1c1c1c', place:'#e0e0e0',
  route:'#c04de0', routeEdge:'#2a0f33'
};
const width = base => ['interpolate',['exponential',1.5],['zoom'],10,base*.5,14,base*1.6,18,base*7];
const notTunnel = ['!=',['coalesce',['get','brunnel'],''],'tunnel'];
const road = (id, classes, color, base, minzoom) => ({
  id, type:'line', source:'omt', 'source-layer':'transportation', minzoom,
  filter:['all',['in',['get','class'],['literal',classes]],notTunnel],
  layout:{'line-cap':'round','line-join':'round'},
  paint:{'line-color':color,'line-width':width(base)}
});
const nameExpr = ['coalesce',['get','name:en'],['get','name']];

const style = {
  version:8, glyphs:GLYPHS,
  sources:{ omt:{type:'vector', url:TILES} },
  layers:[
    {id:'bg',type:'background',paint:{'background-color':C.ground}},
    {id:'blocks',type:'fill',source:'omt','source-layer':'landuse',
      filter:['in',['get','class'],['literal',['residential','commercial','industrial','retail','railway','hospital','school','university','college','neighbourhood','suburb','quarter']]],
      paint:{'fill-color':C.block}},
    {id:'landcover',type:'fill',source:'omt','source-layer':'landcover',
      filter:['in',['get','class'],['literal',['wood','grass','farmland','wetland']]],paint:{'fill-color':C.green}},
    {id:'landuse-green',type:'fill',source:'omt','source-layer':'landuse',
      filter:['in',['get','class'],['literal',['pitch','playground','cemetery','garden','park']]],paint:{'fill-color':C.green}},
    {id:'park',type:'fill',source:'omt','source-layer':'park',paint:{'fill-color':C.green}},
    {id:'aeroway',type:'fill',source:'omt','source-layer':'aeroway',paint:{'fill-color':C.block}},
    {id:'water',type:'fill',source:'omt','source-layer':'water',paint:{'fill-color':C.water}},
    {id:'waterway',type:'line',source:'omt','source-layer':'waterway',
      paint:{'line-color':C.water,'line-width':['interpolate',['linear'],['zoom'],10,.5,16,3]}},
    {id:'building',type:'fill',source:'omt','source-layer':'building',minzoom:14,
      paint:{'fill-color':C.block,'fill-outline-color':C.blockEdge}},
    {id:'tunnel',type:'line',source:'omt','source-layer':'transportation',minzoom:11,
      filter:['all',['==',['get','brunnel'],'tunnel'],['in',['get','class'],['literal',['motorway','trunk','primary']]]],
      paint:{'line-color':C.road,'line-opacity':.3,'line-width':width(1.4),'line-dasharray':[2,1.5]}},
    {id:'rail',type:'line',source:'omt','source-layer':'transportation',minzoom:12,
      filter:['==',['get','class'],'rail'],paint:{'line-color':C.rail,'line-width':1.2,'line-dasharray':[3,3]}},
    road('road-service',['service','track'],C.road,.6,14),
    road('road-minor',['minor'],C.road,1,12),
    road('road-mid',['secondary','tertiary'],C.road,1.3,10),
    road('road-major',['primary','trunk'],C.road,1.6,8),
    road('road-motorway',['motorway'],C.road,2,6),
    {id:'road-label',type:'symbol',source:'omt','source-layer':'transportation_name',minzoom:14,
      filter:['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary','minor']]],
      layout:{'symbol-placement':'line','text-field':nameExpr,'text-font':['Noto Sans Regular'],'text-size':11},
      paint:{'text-color':C.label,'text-halo-color':C.halo,'text-halo-width':1.4}},
    {id:'place-label',type:'symbol',source:'omt','source-layer':'place',
      filter:['in',['get','class'],['literal',['city','town','suburb','neighbourhood','village']]],
      layout:{'text-field':['upcase',nameExpr],'text-font':['Noto Sans Bold'],
        'text-size':['match',['get','class'],'city',15,'town',13,11],'text-letter-spacing':.1},
      paint:{'text-color':C.place,'text-halo-color':C.halo,'text-halo-width':1.6,'text-opacity':.85}}
  ]
};

// ---------- your icons ----------
// Each drawing is matched to the tile's class and subclass. Add a file in icons/ and a row here.
const ICONS = [
  {id:'hospital', tier:'far', keys:['hospital','doctors','clinic','dentist']},
  {id:'police_station', tier:'far', keys:['police']},
  {id:'gas', tier:'far', keys:['fuel']},
  {id:'airport', tier:'far', keys:['airport','aerodrome']},
  {id:'bank', tier:'mid', keys:['bank','atm']},
  {id:'store', tier:'mid', keys:['grocery','supermarket','convenience','general','marketplace','greengrocer']},
  {id:'golf', tier:'mid', keys:['golf','golf_course']},
  {id:'marina', tier:'mid', keys:['marina','ferry_terminal','boat_rental','harbor','harbour','boat']},
  {id:'cinema', tier:'mid', keys:['cinema','theatre','theater']},
  {id:'bar', tier:'near', keys:['bar','pub','restaurant','fast_food','biergarten','cafe','food_court','ice_cream']},
  {id:'clothes_store', tier:'near', keys:['clothing_store','clothes']},
  {id:'barber', tier:'near', keys:['hairdresser','beauty']},
  {id:'tattoo', tier:'near', keys:['tattoo']},
  {id:'dealership', tier:'near', keys:['car']},
  {id:'car_wash', tier:'near', keys:['car_wash']},
  {id:'car_mod_shop', tier:'near', keys:['car_repair']},
  {id:'sport_shop', tier:'near', keys:['sports','outdoor','sports_shop']},
  {id:'strip_club', tier:'near', keys:['stripclub','nightclub','brothel','adult','swingerclub']},
  {id:'tennis', tier:'near', keys:['tennis']}
];
const poiKeys = [...new Set(ICONS.flatMap(i => i.keys))];
function iconMatch(field){
  const expr = ['match', ['get', field]];
  ICONS.forEach(i => expr.push(i.keys, i.id));
  expr.push('');
  return expr;
}
const poiIconExpr = ['case', ['!=', iconMatch('subclass'), ''], iconMatch('subclass'), iconMatch('class')];
const POI_TEXT = ['step', ['zoom'], '', 16, nameExpr];
function loadPng(id){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { if (!map.hasImage(id)) map.addImage(id, img, {pixelRatio:1}); res(); };
    img.onerror = () => res();
    img.src = 'icons/' + id + '.png';
  });
}

// ---------- state ----------
const S = {
  pos:null, compass:null, gpsHeading:null, speed:0, zoom:16.5,
  mode:'explore', follow:true, posDirty:false,
  dest:null, destName:'', route:null, routing:false, lastRouteAt:0, offCount:0, fitted:false
};
const $ = id => document.getElementById(id);

// ---------- map ----------
const map = new maplibregl.Map({
  container:'map', style, center:[-74.006,40.7128], zoom:12,
  attributionControl:false, pitchWithRotate:false, dragRotate:false, maxPitch:60
});
map.touchZoomRotate.disableRotation();
map.touchPitch.disable();
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');

const playerEl = document.createElement('div');
playerEl.className = 'player';
playerEl.innerHTML = '<img src="icons/user.png" width="32" height="32" alt="">';
const player = new maplibregl.Marker({element:playerEl, rotationAlignment:'map', pitchAlignment:'map'});
let playerAdded = false;

const wpEl = document.createElement('div'); wpEl.className = 'wp';
const wpMarker = new maplibregl.Marker({element:wpEl});
const homeEl = document.createElement('div');
homeEl.className = 'home-pin';
homeEl.innerHTML = '<img src="icons/safehouse.png" width="32" height="32" alt="Home">';
const homeMarker = new maplibregl.Marker({element:homeEl, anchor:'center'});
let home = null;
try { home = JSON.parse(localStorage.getItem('radar-home')); } catch (e) { home = null; }
function showHome(){
  if (!home || !Array.isArray(home.lngLat)) return;
  homeMarker.setLngLat(home.lngLat).addTo(map);
}
function saveHome(lngLat, name){
  home = {lngLat, name: name || 'Home'};
  localStorage.setItem('radar-home', JSON.stringify(home));
  showHome();
  toast('Home saved on this phone');
}

function keysFor(tier){ return [...new Set(ICONS.filter(i => i.tier===tier).flatMap(i => i.keys))]; }
function addPoiLayer(id, tier, minzoom, overlap){
  const keys = keysFor(tier);
  map.addLayer({id, type:'symbol', source:'omt', 'source-layer':'poi', minzoom,
    filter:['any', ['in',['get','class'],['literal',keys]], ['in',['get','subclass'],['literal',keys]]],
    layout:{'icon-image':poiIconExpr,'icon-size':1,
      'icon-allow-overlap':overlap,'icon-ignore-placement':overlap,'icon-padding':overlap?0:8,
      'symbol-sort-key':['coalesce',['get','rank'],99],
      'text-field':POI_TEXT,'text-font':['Noto Sans Regular'],'text-size':11,
      'text-offset':[0,1.3],'text-anchor':'top','text-optional':true,'text-max-width':8},
    paint:{'text-color':C.label,'text-halo-color':C.halo,'text-halo-width':1.4}});
}
function poiText(value){
  ['poi-far','poi-mid','poi-near'].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id,'text-field', value); });
}
const motion = {from:null, to:null, display:null, start:0, dur:1, last:0};
function lerpLngLat(a, b, t){
  let dx = b[0]-a[0];
  if (dx>180) dx -= 360;
  if (dx<-180) dx += 360;
  return [a[0]+dx*t, a[1]+(b[1]-a[1])*t];
}
function noteFix(lngLat){
  S.pos = lngLat;
  const prev = motion.display;
  const now = performance.now();
  if (!prev || hav(prev, lngLat) > 400){
    motion.from = lngLat.slice(); motion.to = lngLat.slice(); motion.display = lngLat.slice();
    motion.start = now; motion.dur = 1; motion.last = now;
    return;
  }
  motion.from = prev.slice();
  motion.to = lngLat.slice();
  motion.dur = Math.max(500, Math.min(motion.last ? now-motion.last : 1000, 1800));
  motion.start = now; motion.last = now;
}
function shownPos(){
  if (!motion.to) return S.pos;
  const t = Math.min(1, (performance.now()-motion.start)/motion.dur);
  const e = 1-Math.pow(1-t, 2);
  motion.display = lerpLngLat(motion.from, motion.to, e);
  return motion.display;
}

map.on('load', async () => {
  map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'route-edge',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':C.routeEdge,'line-width':['interpolate',['linear'],['zoom'],10,6,18,18]}},'road-label');
  map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':C.route,'line-width':['interpolate',['linear'],['zoom'],10,3.5,18,12]}},'road-label');
  await Promise.all(ICONS.map(i => loadPng(i.id)));
  addPoiLayer('poi-far', 'far', 11, false);
  addPoiLayer('poi-mid', 'mid', 13, false);
  addPoiLayer('poi-near', 'near', 15, true);
  map.addLayer({id:'airport-icon',type:'symbol',source:'omt','source-layer':'aeroway',minzoom:10,
    filter:['==',['get','class'],'aerodrome'],
    layout:{'icon-image':'airport','icon-size':1,'icon-allow-overlap':false,'icon-padding':4}});
  map.addLayer({id:'golf-icon',type:'symbol',source:'omt','source-layer':'landuse',minzoom:14,
    filter:['==',['get','class'],'golf_course'],
    layout:{'icon-image':'golf','icon-size':1,'icon-allow-overlap':false,'icon-padding':4}});
  if (S.mode==='drive') poiText('');
  showHome();
});

map.on('dragstart', e => { if (!e.originalEvent) return; releaseFollow(); });
map.on('zoomstart', e => { if (!e.originalEvent) return; releaseFollow(); });
function releaseFollow(){
  S.follow=false;
  $(S.mode==='drive' ? 'recenterDrive' : 'recenter').classList.remove('hidden');
}
map.on('click', e => {
  if (S.mode!=='explore') return;
  $('results').classList.add('hidden');
  const hit = map.queryRenderedFeatures(e.point, {layers:['poi-far','poi-mid','poi-near','airport-icon','golf-icon'].filter(id => map.getLayer(id))})[0];
  if (hit){
    const name = hit.properties['name:en'] || hit.properties.name || 'Place';
    setDestination([e.lngLat.lng, e.lngLat.lat], name);
    return;
  }
  setDestination([e.lngLat.lng, e.lngLat.lat], 'Dropped waypoint');
});

// ---------- helpers ----------
const rad = d => d*Math.PI/180;
function hav(a,b){
  const R=6371000, dLat=rad(b[1]-a[1]), dLon=rad(b[0]-a[0]);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function smoothAngle(prev,next,k){
  if (prev==null) return next;
  const diff=((next-prev+540)%360)-180;
  return (prev+diff*k+360)%360;
}
function fmtDist(m){
  const mi=m/1609.34;
  if (mi<0.1) return Math.max(50,Math.round(m*3.28084/50)*50)+' ft';
  return (mi<10?mi.toFixed(1):Math.round(mi))+' mi';
}
function fmtDur(s){
  const m=Math.max(1,Math.round(s/60));
  return m<60 ? m+' min' : Math.floor(m/60)+' hr '+(m%60)+' min';
}
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
function heading(){
  if (S.speed>4 && S.gpsHeading!=null) return S.gpsHeading;
  return S.compass ?? S.gpsHeading ?? 0;
}
const HEAD_STEP = 3;
let viewBearing = null;
function angleDiff(a, b){ return ((b-a+540)%360)-180; }
function stableHeading(){
  const raw = heading();
  if (viewBearing==null){
    viewBearing = (Math.round(raw/HEAD_STEP)*HEAD_STEP%360+360)%360;
    return viewBearing;
  }
  const diff = angleDiff(viewBearing, raw);
  if (Math.abs(diff) < HEAD_STEP) return viewBearing;
  const steps = Math.trunc(diff/HEAD_STEP);
  if (!steps) return viewBearing;
  viewBearing = (viewBearing + steps*HEAD_STEP + 360) % 360;
  return viewBearing;
}
function locateOnRoute(p){
  const c=S.route.coords, kx=111320*Math.cos(rad(p[1])), ky=110540;
  let best={d:Infinity,idx:0,t:0};
  for (let i=0;i<c.length-1;i++){
    const ax=(c[i][0]-p[0])*kx, ay=(c[i][1]-p[1])*ky;
    const dx=(c[i+1][0]-c[i][0])*kx, dy=(c[i+1][1]-c[i][1])*ky;
    const L=dx*dx+dy*dy;
    let t=L ? -(ax*dx+ay*dy)/L : 0; t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(ax+t*dx, ay+t*dy);
    if (d<best.d) best={d,idx:i,t};
  }
  return best;
}

// ---------- turn instructions ----------
const ARROWS = {'left':'←','slight left':'↖','sharp left':'↙','right':'→','slight right':'↗','sharp right':'↘','straight':'↑','uturn':'↶'};
const arrowFor = step => step.maneuver.type==='arrive' ? '◆' : (ARROWS[step.maneuver.modifier]||'↑');
function instruction(step){
  const m=step.maneuver, name=step.name||step.ref||'', onto=name?' onto '+name:'', mod=m.modifier||'';
  switch(m.type){
    case 'depart': return 'Head out'+(name?' on '+name:'');
    case 'arrive': return 'Arrive at your waypoint';
    case 'turn': case 'end of road':
      if (mod==='uturn') return 'Make a U-turn';
      if (mod==='straight') return 'Continue straight'+onto;
      return 'Turn '+mod+onto;
    case 'continue': case 'new name': return 'Continue'+onto;
    case 'merge': return 'Merge'+onto;
    case 'on ramp': return 'Take the ramp'+onto;
    case 'off ramp': return 'Take the exit'+onto;
    case 'fork': return 'Keep '+mod.replace('slight ','')+onto;
    case 'roundabout': case 'rotary': case 'roundabout turn':
      return 'At the roundabout, take exit '+(m.exit||1)+onto;
    default: return mod ? 'Go '+mod+onto : 'Continue'+onto;
  }
}

// ---------- routing ----------
function setDestination(lngLat,name){
  S.dest=lngLat; S.destName=name; S.route=null; S.fitted=false;
  wpMarker.setLngLat(lngLat).addTo(map);
  $('destName').textContent=name;
  $('routeMeta').textContent = S.pos ? 'Finding a route…' : 'Waiting for your location…';
  $('preview').classList.add('hidden'); $('preview').innerHTML='';
  $('previewBtn').textContent='Trip preview';
  $('routeCard').classList.remove('hidden');
  document.body.classList.add('has-route');
  if (S.pos) fetchRoute();
}

async function fetchRoute(){
  if (!S.pos || !S.dest || S.routing) return;
  S.routing=true; S.lastRouteAt=Date.now();
  const url=`${ROUTER}${S.pos[0]},${S.pos[1]};${S.dest[0]},${S.dest[1]}?overview=full&geometries=geojson&steps=true`;
  try{
    const r=await fetch(url); const j=await r.json();
    if (j.code!=='Ok' || !j.routes || !j.routes.length) throw new Error(j.message||'no road path found');
    const rt=j.routes[0], coords=rt.geometry.coordinates;
    const cum=[0];
    for (let i=1;i<coords.length;i++) cum[i]=cum[i-1]+hav(coords[i-1],coords[i]);
    const steps=rt.legs[0].steps; let from=0;
    steps.forEach(s=>{
      let bi=from, bd=Infinity;
      for (let i=from;i<coords.length;i++){ const d=hav(coords[i],s.maneuver.location); if(d<bd){bd=d;bi=i;} if(bd<1)break; }
      s._idx=bi; from=bi;
    });
    S.route={coords,cum,total:cum[cum.length-1],duration:rt.duration,steps};
    S.offCount=0;
    map.getSource('route')?.setData({type:'Feature',geometry:rt.geometry,properties:{}});
    if (S.mode==='explore' && !S.fitted){
      const b=coords.reduce((bb,c)=>bb.extend(c), new maplibregl.LngLatBounds(coords[0],coords[0]));
      map.fitBounds(b,{padding:{top:110,bottom:210,left:50,right:50},duration:600});
      S.follow=false; S.fitted=true; $('recenter').classList.remove('hidden');
    }
    navUpdate();
  }catch(e){
    $('routeMeta').textContent='No route found. Try a spot on a road.';
    toast('Couldn’t get a route. Try a spot on a road.');
  }finally{ S.routing=false; }
}

function clearRoute(){
  S.dest=null; S.route=null;
  wpMarker.remove();
  map.getSource('route')?.setData({type:'FeatureCollection',features:[]});
  $('routeCard').classList.add('hidden'); $('banner').classList.add('hidden');
  $('preview').classList.add('hidden'); $('preview').innerHTML='';
  $('previewBtn').textContent='Trip preview';
  $('etaMain').textContent='Free drive'; $('etaSub').textContent='Search or tap the map to set a waypoint';
  document.body.classList.remove('has-route');
}
function fillPreview(){
  const box=$('preview');
  box.innerHTML='';
  if (!S.route){ box.innerHTML='<div class="step"><span class="txt">Finding the turns…</span></div>'; return; }
  S.route.steps.forEach(step=>{
    const row=document.createElement('div');
    row.className='step';
    const arr=document.createElement('span'); arr.className='arr'; arr.textContent=arrowFor(step);
    const txt=document.createElement('span'); txt.className='txt'; txt.textContent=instruction(step);
    const miles=document.createElement('span'); miles.className='miles'; miles.textContent=fmtDist(step.distance||0);
    row.append(arr, txt, miles);
    box.appendChild(row);
  });
}

function navUpdate(){
  const R=S.route; if (!R || !S.pos) return;
  if (hav(S.pos,S.dest)<30){ toast('You’ve arrived'); clearRoute(); return; }
  const loc=locateOnRoute(S.pos);
  if (loc.d>50){
    S.offCount++;
    if (S.offCount>=3 && Date.now()-S.lastRouteAt>12000){ toast('Rerouting'); fetchRoute(); }
  } else S.offCount=0;
  const along=R.cum[loc.idx]+loc.t*(R.cum[loc.idx+1]-R.cum[loc.idx]);
  const remaining=Math.max(0,R.total-along);
  const secs=R.duration*(remaining/R.total);
  let si=R.steps.length-1;
  for (let i=1;i<R.steps.length;i++){ if (R.steps[i]._idx>loc.idx){ si=i; break; } }
  const step=R.steps[si], next=R.steps[si+1];
  const toStep=Math.max(0,R.cum[step._idx]-along);

  $('routeMeta').textContent=fmtDur(secs)+', '+fmtDist(remaining);
  $('turnArrow').textContent=arrowFor(step);
  $('turnDist').textContent=fmtDist(toStep);
  $('turnText').textContent=instruction(step);
  // "Then" row when two turns are close together
  if (next && R.cum[next._idx]-R.cum[step._idx] < 200){
    $('thenArrow').textContent=arrowFor(next); $('thenRow').classList.remove('hidden');
  } else $('thenRow').classList.add('hidden');
  $('banner').classList.remove('hidden');
  const eta=new Date(Date.now()+secs*1000);
  $('etaMain').textContent=eta.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' arrival';
  $('etaSub').textContent=fmtDur(secs)+', '+fmtDist(remaining);
}

// ---------- camera ----------
let raf=null;
const schedule=()=>{ if(!raf) raf=requestAnimationFrame(render); };
function render(){
  raf=null;
  if (!S.pos) return;
  const p = shownPos();
  const h = stableHeading();
  const moving = motion.to && (performance.now()-motion.start) < motion.dur;
  if (!playerAdded){ player.setLngLat(p).addTo(map); playerAdded=true; }
  player.setLngLat(p).setRotation(h);
  const busy = map.isMoving() || map.isZooming();
  if (!busy && S.follow && S.mode==='drive'){
    const target = S.speed>22 ? 15.4 : S.speed>12 ? 16.2 : 17;
    S.zoom += (target-S.zoom)*0.08;
    map.jumpTo({center:p, bearing:h, zoom:S.zoom, pitch:55});
    if (moving || Math.abs(target-S.zoom)>0.01) schedule();
  } else if (!busy && S.follow && S.posDirty){
    map.jumpTo({center:p});
    if (moving) schedule();
  } else if (moving) schedule();
  S.posDirty=false;
}

// ---------- sensors ----------
function listenCompass(){
  window.addEventListener('deviceorientation', e=>{
    let h=null;
    if (typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;
    else if (e.absolute && e.alpha!=null) h=360-e.alpha;
    if (h==null) return;
    const screenAngle=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    S.compass=smoothAngle(S.compass,(h+screenAngle+360)%360,0.08);
    schedule();
  });
}
let firstFix=true;
function startGPS(){
  if (!('geolocation' in navigator)){ toast('This browser has no location access.'); return; }
  navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    noteFix([c.longitude,c.latitude]); S.posDirty=true;
    S.speed = (c.speed!=null && c.speed>=0) ? c.speed : 0;
    if (c.heading!=null && !isNaN(c.heading) && S.speed>2.5) S.gpsHeading=c.heading;
    $('speed').textContent=Math.round(S.speed*2.23694);
    if (firstFix){ firstFix=false; map.jumpTo({center:S.pos,zoom:15}); }
    if (S.dest && !S.route) fetchRoute(); else navUpdate();
    schedule();
  }, err=>{
    toast(err.code===1 ? 'Location is blocked. Turn on Location for Safari in iPhone Settings.' : 'Can’t find your location yet.');
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
}
async function keepAwake(){
  try{ if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if (document.visibilityState==='visible') keepAwake(); });

// ---------- modes ----------
function setMode(m){
  S.mode=m;
  const drive = m==='drive';
  document.body.classList.toggle('drive', drive);
  if (map.getLayer('poi-far')) poiText(drive ? '' : POI_TEXT);
  $('recenter').classList.add('hidden'); $('recenterDrive').classList.add('hidden');
  S.follow=true;
  if (drive){
    const h=window.innerHeight;
    map.setPadding({top:h*0.45,bottom:0,left:0,right:0});   // you sit in the lower part of the screen
    S.zoom=Math.max(map.getZoom(),15.5);
    if (!S.pos) toast('Waiting for your location…');
    navUpdate();
  } else {
    map.setPadding({top:0,bottom:0,left:0,right:0});
    map.easeTo({bearing:0,pitch:0,zoom:15,center:S.pos||map.getCenter(),duration:500});
  }
  schedule();
}

// ---------- search ----------
let searchTimer = null, searchAbort = null, searchSeq = 0;
function renderResults(items){
  const box = $('results');
  box.innerHTML = '';
  if (!items.length){
    box.innerHTML = '<button disabled>No matches yet. Keep typing, or add a town.</button>';
    box.classList.remove('hidden');
    return;
  }
  items.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = r.title;
    if (r.dist != null){
      const d = document.createElement('span');
      d.className = 'dist';
      d.textContent = r.dist;
      b.appendChild(d);
    }
    const sm = document.createElement('small');
    sm.textContent = r.detail;
    b.appendChild(sm);
    b.onclick = () => {
      box.classList.add('hidden');
      $('q').value = r.title;
      setDestination(r.lngLat, r.title);
    };
    box.appendChild(b);
  });
  box.classList.remove('hidden');
}
async function runSearch(q){
  const seq = ++searchSeq;
  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  const box = $('results');
  box.innerHTML = '<button disabled>Searching…</button>';
  box.classList.remove('hidden');
  let url = `${SEARCH}?q=${encodeURIComponent(q)}&limit=6`;
  if (S.pos) url += `&lat=${S.pos[1]}&lon=${S.pos[0]}`;
  try {
    const data = await (await fetch(url, {signal: searchAbort.signal})).json();
    if (seq !== searchSeq) return;
    const items = (data.features || []).map(f => {
      const p = f.properties || {};
      const title = p.name || p.street || p.city || 'Place';
      const place = [p.street, p.city, p.state, p.country].filter(Boolean).join(', ');
      const meters = S.pos ? hav(S.pos, f.geometry.coordinates) : null;
      return {title, detail:place, dist: meters==null ? null : fmtDist(meters), meters, lngLat: f.geometry.coordinates};
    }).sort((a,b) => (a.meters??1e12) - (b.meters??1e12));
    renderResults(items);
  } catch (err) {
    if (err.name === 'AbortError' || seq !== searchSeq) return;
    box.innerHTML = '<button disabled>Search is unavailable. Check your connection.</button>';
  }
}
function queueSearch(){
  const q = $('q').value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2){
    $('results').classList.add('hidden');
    $('results').innerHTML = '';
    return;
  }
  searchTimer = setTimeout(() => runSearch(q), 350);
}
$('q').addEventListener('input', queueSearch);
$('search').addEventListener('submit', e => {
  e.preventDefault();
  clearTimeout(searchTimer);
  const q = $('q').value.trim();
  if (q.length < 2) return;
  runSearch(q);
});
$('q').addEventListener('focus', () => { if ($('results').children.length) $('results').classList.remove('hidden'); });

// ---------- buttons ----------
$('recenter').onclick=()=>{ S.follow=true; $('recenter').classList.add('hidden'); if (S.pos) map.easeTo({center:S.pos,duration:400}); };
$('recenterDrive').onclick=()=>{ S.follow=true; $('recenterDrive').classList.add('hidden'); schedule(); };
$('toDrive').onclick=()=>setMode('drive');
$('goBtn').onclick=()=>setMode('drive');
$('exitBtn').onclick=()=>setMode('explore');
$('clearBtn').onclick=clearRoute;
$('previewBtn').onclick=()=>{
  const box=$('preview');
  const open=box.classList.toggle('hidden');
  $('previewBtn').textContent = open ? 'Trip preview' : 'Hide preview';
  if (!open) fillPreview();
};
$('setHomeBtn').onclick=()=>{
  if (!S.pos){ toast('Waiting for your location before setting home'); return; }
  saveHome(S.pos, 'Home');
};
$('homeBtn').onclick=()=>{
  if (!home){ toast('No home yet. Use Set home.'); return; }
  S.follow=false;
  $('recenter').classList.remove('hidden');
  map.easeTo({center:home.lngLat, zoom:16, duration:500});
};

$('startBtn').onclick=async ()=>{
  if (typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    try{ if (await DeviceOrientationEvent.requestPermission()==='granted') listenCompass(); else toast('Motion is off, so the map will turn using GPS while you drive.'); }
    catch(e){ toast('Motion access failed. The map will turn using GPS.'); }
  } else listenCompass();
  startGPS(); keepAwake();
  $('start').classList.add('hidden');
};
if (!window.isSecureContext){
  $('startNote').textContent='Location only works from an https:// address. Open this from your GitHub Pages link.';
  $('startNote').classList.remove('hidden');
}
</script>
